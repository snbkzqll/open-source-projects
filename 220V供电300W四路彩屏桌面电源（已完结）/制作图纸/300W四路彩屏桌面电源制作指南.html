<p class="p1">第一次通电的准备工作：</p>
<p class="p2"><br></p>
<p class="p1">1. 所有板子焊好了，不要急于通电，先把板子洗干净，尽量把残余的锡珠用镊子清理掉，没钢网的话电容电阻中间一般都会有锡珠。</p>
<p class="p1">2. 同时认真检查各半导体器件的摆放方向有没有错，最好对照实物照片查看。</p>
<p class="p1">3. 用放大镜看看焊接情况，排除连锡，虚焊的问题，最后再用万用表量一下电源正负的阻值确保没有短路故障。</p>
<p class="p1">4. 第一次通电，只接通几秒就断电。然后逐一去摸一下各个芯片，MOS管看看是否有异常发热，正常情况都应该只略高于室温。</p>
<p class="p1">5. 以上做完都没问题了，再持续通电去测试输出电压电流之类。</p>
